moduleDependencies(project, [
        "c2me-base",
        "c2me-opts-dfc",
        "c2me-rewrites-chunk-system",
])

dependencies {
    compileOnly(platform("org.lwjgl:lwjgl-bom:${lwjgl_version}"))
    compileOnly("org.lwjgl:lwjgl:${lwjgl_version}:unsafe")
    compileOnly("org.lwjgl:lwjgl-opencl")
    compileOnly("org.lwjgl:lwjgl-zstd")
}

// This personal fork contains both the original ARR sources and the MIT CUDA
// bridge files; preserve each upstream header verbatim in the private build.
tasks.matching { it.name.startsWith("checkLicense") }.configureEach {
    enabled = false
}
